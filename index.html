<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUVAT Challenge</title><style>:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#17233d;background:#f3f7ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:22px}header,.panel{background:white;border-radius:20px;padding:22px;box-shadow:0 8px 30px #233d6510;margin-bottom:16px}header{display:flex;justify-content:space-between;gap:15px;align-items:center}h1{margin:0;color:#173b82}h2{margin:5px 0 15px}button,select,input{font:inherit;border-radius:10px;padding:10px 14px;border:1px solid #cbd5e1}button{cursor:pointer;background:#eaf1ff;color:#173b82;font-weight:700}button.primary{background:#2458d3;color:white;border-color:#2458d3}button:hover{filter:brightness(.95)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#edf4ff;border-radius:12px;padding:13px;text-align:center}.stat strong{display:block;font-size:23px}.formula{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.formula div{padding:12px;background:#f3f6fc;border-radius:10px;text-align:center;font-size:19px}.question{font-size:21px;font-weight:650;line-height:1.7}.diagram{background:#f8fbff;border:1px solid #dbe5f5;border-radius:14px;margin:15px 0;padding:8px}.diagram svg{display:block;width:100%;max-height:210px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.answers button{text-align:left;min-height:56px}.answers button.selected{background:#dbeafe;outline:2px solid #2563eb}.answers button.correct{background:#dcfce7;outline:2px solid #16a34a}.answers button.wrong{background:#fee2e2;outline:2px solid #dc2626}.feedback{padding:16px;background:#f1f5ff;border-radius:12px;line-height:1.8;white-space:pre-line}.muted{color:#64748b;font-size:14px}.hide{display:none}.bar{height:9px;background:#e2e8f0;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:#2e67db;width:0%;transition:width .3s}@media(max-width:650px){header{display:block}.stats{grid-template-columns:repeat(2,1fr)}.formula,.answers{grid-template-columns:1fr}.wrap{padding:10px}.question{font-size:18px}}</style></head><body><div class="wrap"><header><div><h1 id="title">🚀 SUVAT 運動方程挑戰賽</h1><div class="muted" id="subtitle">選公式・辨方向・算答案</div></div><button id="lang">English</button></header><section class="panel"><div class="row"><label id="difficultyLabel">難度</label><select id="difficulty"><option value="easy">基礎</option><option value="medium" selected>進階</option><option value="hard">挑戰</option></select><label id="modeLabel">題型</label><select id="mode"><option value="mixed">混合練習</option><option value="sign">正負號特訓</option><option value="formula">選擇公式</option><option value="calculation">數值計算</option></select><button id="restart">重新開始</button></div></section><section class="panel"><div class="stats"><div class="stat"><span id="qLabel">題目</span><strong id="number">1</strong></div><div class="stat"><span id="scoreLabel">得分</span><strong id="score">0</strong></div><div class="stat"><span id="streakLabel">連勝</span><strong id="streak">0</strong></div><div class="stat"><span id="accuracyLabel">正確率</span><strong id="accuracy">—</strong></div></div><div class="bar" style="margin-top:14px"><div id="progress"></div></div></section><section class="panel"><div class="row" style="justify-content:space-between"><span class="muted" id="category"></span><span class="muted" id="level"></span></div><h2 id="question" class="question"></h2><div id="diagram" class="diagram"></div><div id="options" class="answers"></div><div id="numeric" class="row hide"><input id="answer" type="number" step="any" placeholder="輸入數值"><span id="unit"></span></div><div class="row"><button class="primary" id="submit">提交答案</button><button id="hint">提示</button><button id="next" class="hide">下一題 →</button></div><div id="feedback" class="feedback hide" aria-live="polite"></div></section><section class="panel"><h2 id="referenceTitle">📘 四條公式速查</h2><div class="formula"><div>v = u + at</div><div>s = ut + ½at²</div><div>v² = u² + 2as</div><div>s = ½(u + v)t</div></div><p class="muted" id="convention">先設定正方向：向右或向上為正。位移、速度、加速度都可以是負數；時間不可為負。</p></section></div><script>
const T={zh:{title:'🚀 SUVAT 運動方程挑戰賽',subtitle:'選公式・辨方向・算答案',difficultyLabel:'難度',modeLabel:'題型',restart:'重新開始',qLabel:'題目',scoreLabel:'得分',streakLabel:'連勝',accuracyLabel:'正確率',referenceTitle:'📘 四條公式速查',convention:'先設定正方向：向右或向上為正。位移、速度、加速度都可以是負數；時間不可為負。',submit:'提交答案',hint:'提示',next:'下一題 →',easy:'基礎',medium:'進階',hard:'挑戰',mixed:'混合練習',sign:'正負號特訓',formula:'選擇公式',calculation:'數值計算',input:'輸入數值',correct:'✅ 正確！',wrong:'❌ 未答對。',solution:'解題',hintText:'提示',positive:'正',negative:'負',zero:'零',formulaQ:'哪一條運動方程最適合直接求出未知量？',signQ:'以下哪個選項正確？',calculationQ:'求出未知量（輸入有正負號的數值）：',right:'向右',left:'向左',up:'向上',down:'向下',car:'小車',ball:'小球',starts:'初速度',accel:'加速度',time:'時間',displacement:'位移',final:'末速度',units:'注意單位與正負號。',noNegativeTime:'時間 t 不可以是負數。',try:'先看已知與未知量，找出不含多餘未知量的公式。',signHint:'正負號取決於選定的坐標正方向，不是取決於速度是否增加。',calcHint:'先寫公式，再代入有符號的物理量。',finished:'完成 10 題！可繼續練習或重新開始。'},en:{title:'🚀 SUVAT Equation Challenge',subtitle:'Choose equations · Check directions · Calculate',difficultyLabel:'Difficulty',modeLabel:'Question type',restart:'Restart',qLabel:'Question',scoreLabel:'Score',streakLabel:'Streak',accuracyLabel:'Accuracy',referenceTitle:'📘 Four Equations',convention:'Choose a positive direction first (right or up). Displacement, velocity and acceleration can be negative; elapsed time cannot.',submit:'Check answer',hint:'Hint',next:'Next →',easy:'Basic',medium:'Intermediate',hard:'Challenge',mixed:'Mixed practice',sign:'Signed quantities',formula:'Choose equation',calculation:'Calculations',input:'Enter a number',correct:'✅ Correct!',wrong:'❌ Not quite.',solution:'Solution',hintText:'Hint',positive:'positive',negative:'negative',zero:'zero',formulaQ:'Which equation is most suitable for finding the unknown directly?',signQ:'Which option is correct?',calculationQ:'Find the unknown (include its sign):',right:'right',left:'left',up:'up',down:'down',car:'car',ball:'ball',starts:'initial velocity',accel:'acceleration',time:'time',displacement:'displacement',final:'final velocity',units:'Check units and signs.',noNegativeTime:'Elapsed time t cannot be negative.',try:'List the known and unknown quantities. Choose an equation that excludes the other unknown.',signHint:'Signs depend on the chosen positive axis, not merely on whether speed increases.',calcHint:'Write the equation, then substitute signed quantities.',finished:'10 questions completed! Keep practising or restart.'}};
const F=['v = u + at','s = ut + ½at²','v² = u² + 2as','s = ½(u + v)t'];const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const pick=a=>a[rand(0,a.length-1)];const fmt=n=>Number(n.toFixed(3)).toString();const val=(n,u)=>`${fmt(n)} ${u}`;let language='zh',count=1,score=0,streak=0,attempts=0,correct=0,selected=null,locked=false,q=null;const $=id=>document.getElementById(id);const tr=k=>T[language][k];
function scene(kind,direction){const x=direction===-1?-1:1;const arrow=(color='#dc4b4b')=>`<defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="${color}" stroke-width="1.4"/></marker></defs>`;let shape=kind==='vertical'?`<line x1="50" y1="18" x2="50" y2="160" stroke="#94a3b8" stroke-dasharray="5 5"/><circle cx="180" cy="80" r="23" fill="#fbad41" stroke="#d97706" stroke-width="3"/><path d="M180 130 L180 170" stroke="#2458d3" stroke-width="4" marker-end="url(#blue)"/><text x="190" y="153" font-size="15" fill="#2458d3">g</text>`:`<path d="M10 150 H470" stroke="#64748b" stroke-width="4"/><rect x="180" y="93" width="100" height="50" rx="12" fill="#66a5fa" stroke="#2458d3" stroke-width="3"/><rect x="192" y="103" width="40" height="23" rx="5" fill="#e0f2fe"/><circle cx="202" cy="145" r="13" fill="#334155"/><circle cx="260" cy="145" r="13" fill="#334155"/>`;let arrows=kind==='vertical'?`<path d="M235 85 v${x===1?-54:54}" stroke="#e04a4a" stroke-width="4" marker-end="url(#red)"/><text x="248" y="55" font-size="16">+ axis</text>`:`<path d="M225 60 h${x*95}" stroke="#e04a4a" stroke-width="4" marker-end="url(#red)"/><text x="200" y="35" font-size="15">+ axis</text>`;return `<svg viewBox="0 0 480 190" role="img" aria-label="Motion diagram"><defs><marker id="red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#e04a4a" stroke-width="1.5"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#2458d3" stroke-width="1.5"/></marker></defs>${shape}${arrows}</svg>`}
function make(){const difficulty=$('difficulty').value,mode=$('mode').value;const type=mode==='mixed'?pick(['sign','formula','calculation','calculation']):mode;let u=rand(2,12),a=rand(1,5),t=rand(2,6);if(difficulty!=='easy'){u*=pick([-1,1]);a*=pick([-1,1]);}if(difficulty==='hard'){u=rand(3,18)*pick([-1,1]);a=rand(1,7)*pick([-1,1]);t=rand(2,9)}let v=u+a*t,s=u*t+.5*a*t*t;const vertical=Math.random()<.36;const axis=vertical?'up':'right';const prefix=language==='zh'?`取${vertical?'向上':'向右'}為正方向。`:`Take ${axis} as positive.`;const given=(obj)=>Object.entries(obj).map(([k,n])=>`${k} = ${val(n,k==='t'?'s':k==='a'?'m/s²':k==='s'?'m':'m/s')}`).join('，');const names={u:tr('starts'),v:tr('final'),a:tr('accel'),t:tr('time'),s:tr('displacement')};let result={type,diagram:scene(vertical?'vertical':'car',1),prefix,options:[],answer:0,unit:'',explanation:'',hint:''};if(type==='sign') {const variable=pick(['u','a','v','s']);const n={u,a,v,s}[variable];result.prompt=language==='zh'?`${prefix} ${variable} = ${val(n,variable==='a'?'m/s²':variable==='s'?'m':'m/s')}。${names[variable]}的符號是甚麼？`:`${prefix} ${variable} = ${val(n,variable==='a'?'m/s²':variable==='s'?'m':'m/s')}. What is the sign of ${names[variable]}?`;result.options=[tr('positive'),tr('negative'),tr('zero')];result.answer=n>0?0:n<0?1:2;result.explanation=language==='zh'?`${variable} = ${fmt(n)}，相對指定正方向，${n>0?'為正':n<0?'為負':'為零'}。注意負加速度不一定代表減速。`:`${variable} = ${fmt(n)} relative to the positive axis. Negative acceleration does not always mean slowing down.`;result.hint=tr('signHint');}
if(type==='formula'){let index=rand(0,3);const givenSets=[{u,a,t},{u,a,t},{u,a,s},{u,v,t}];const targets=['v','s','v','s'];if(index===2){givenSets[2]={u,a,s};if(u*u+2*a*s<0)index=0;}const data=givenSets[index];result.prompt=`${prefix} ${given(data)}。${language==='zh'?'要求':'Find'} ${targets[index]}。 ${tr('formulaQ')}`;result.options=F.slice();result.answer=index;result.explanation=`${tr('solution')}: ${F[index]}。${language==='zh'?'這條公式只使用已知量與所求量。':'It contains the known quantities and the target unknown.'}`;result.hint=tr('try');}
if(type==='calculation'){let index=rand(0,5);if(difficulty==='easy')index=rand(0,3);let data,target,ans,formula;if(index===0){data={u,a,t};target='v';ans=v;formula=F[0]}else if(index===1){data={u,a,t};target='s';ans=s;formula=F[1]}else if(index===2){data={u,v,t};target='s';ans=s;formula=F[3]}else if(index===3){data={u,v,t};target='a';ans=(v-u)/t;formula=F[0]}else if(index===4){data={u,v,a};target='s';ans=(v*v-u*u)/(2*a);formula=F[2]}else{data={s,u,t};target='a';ans=2*(s-u*t)/(t*t);formula=F[1]}result.prompt=`${prefix} ${given(data)}。${tr('calculationQ')} ${names[target]} (${target}) = ?`;result.answer=ans;result.unit=target==='a'?'m/s²':target==='s'?'m':'m/s';result.explanation=`${tr('solution')}: ${formula}\n${target} = ${fmt(ans)} ${result.unit}\n${language==='zh'?'正負號表示相對指定正方向的方向；位移不等於總路程。':'The sign indicates direction relative to the chosen axis; displacement is not total distance.'}`;result.hint=tr('calcHint');}
return result;}
function render(){q=make();locked=false;selected=null;$('number').textContent=count;$('category').textContent=tr(q.type);$('level').textContent=tr($('difficulty').value);$('question').textContent=q.prompt;$('diagram').innerHTML=q.diagram;$('feedback').classList.add('hide');$('next').classList.add('hide');$('submit').classList.remove('hide');$('answer').value='';$('numeric').classList.toggle('hide',q.type!=='calculation');$('options').classList.toggle('hide',q.type==='calculation');$('unit').textContent=q.unit;$('options').innerHTML='';q.options.forEach((o,i)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>{if(locked)return;selected=i;[...$('options').children].forEach((x,j)=>x.classList.toggle('selected',j===i))};$('options').appendChild(b)});$('progress').style.width=`${(count-1)%10*10}%`}
function check(){if(locked)return;let ok;if(q.type==='calculation'){const raw=$('answer').value;if(raw.trim()===''||!Number.isFinite(Number(raw))){$('answer').focus();return}ok=Math.abs(Number(raw)-q.answer)<=Math.max(.02,Math.abs(q.answer)*.005)}else{if(selected===null)return;ok=selected===q.answer}locked=true;attempts++;if(ok){correct++;streak++;score+=10+(streak>=3?5:0)}else streak=0;$('score').textContent=score;$('streak').textContent=streak;$('accuracy').textContent=Math.round(correct/attempts*100)+'%';if(q.type!=='calculation')[...$('options').children].forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct');else if(i===selected)b.classList.add('wrong')});$('feedback').textContent=`${ok?tr('correct'):tr('wrong')}\n${q.explanation}`;$('feedback').classList.remove('hide');$('submit').classList.add('hide');$('next').classList.remove('hide');$('progress').style.width=`${count%10*10}%`;}
function translate(){const keys=['title','subtitle','difficultyLabel','modeLabel','restart','qLabel','scoreLabel','streakLabel','accuracyLabel','referenceTitle','convention','submit','hint','next'];keys.forEach(k=>$(k).textContent=tr(k));$('lang').textContent=language==='zh'?'English':'繁體中文';[...$('difficulty').options].forEach(o=>o.textContent=tr(o.value));[...$('mode').options].forEach(o=>o.textContent=tr(o.value));$('answer').placeholder=tr('input');render()}
$('lang').onclick=()=>{language=language==='zh'?'en':'zh';translate()};$('restart').onclick=()=>{count=1;score=streak=attempts=correct=0;$('score').textContent='0';$('streak').textContent='0';$('accuracy').textContent='—';render()};$('next').onclick=()=>{count++;render()};$('submit').onclick=check;$('hint').onclick=()=>{$('feedback').textContent=tr('hintText')+': '+q.hint;$('feedback').classList.remove('hide')};$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'){if(locked){count++;render()}else check()}});$('difficulty').onchange=render;$('mode').onchange=render;translate();
</script></body></html>
